<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>INVT · Funis e Mapas</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#0147FF;--ink:#161b2e;--mut:#6a7286;--ln:#e4e8f0;--bg:#f4f6fa;--hd:56px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header */
#top{height:var(--hd);display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--ln);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:9px;font-family:Manrope;font-weight:800;font-size:16px;white-space:nowrap}
.brand svg{width:26px;height:25px}
.brand small{font:600 13px Inter;color:var(--mut);padding-left:9px;border-left:1px solid var(--ln)}
.seg{display:flex;background:#eef1f7;border-radius:10px;padding:3px;margin-left:8px}
.seg button{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut);display:flex;gap:7px;align-items:center;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,30,60,.13)}
.seg button.on svg{color:var(--b)}
.bsel{position:relative;display:flex;align-items:center}
.bsel select{appearance:none;-webkit-appearance:none;height:34px;border:1px solid var(--ln);border-radius:9px;padding:0 32px 0 30px;font:600 13px Inter;color:var(--ink);background:#fff;cursor:pointer;max-width:230px}
.bsel .dot{position:absolute;left:12px;width:9px;height:9px;border-radius:3px;background:var(--b);pointer-events:none}
.bsel:after{content:'';position:absolute;right:12px;top:13px;width:6px;height:6px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);pointer-events:none}
.sp{flex:1}.hgrp{display:flex;gap:6px}
.ur{display:flex}.ur .hb{border-radius:0;padding:0 10px}.ur .hb:first-child{border-radius:9px 0 0 9px}.ur .hb+.hb{border-radius:0 9px 9px 0;margin-left:-1px}.hb:disabled{opacity:.4;cursor:default}
.hb{height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--ln);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;background:#fff;white-space:nowrap}
.hb:hover{background:#f5f7fb}.hb.on{background:#eef3ff;border-color:#c9d7ff;color:var(--b)}
.hb.pri{background:var(--b);border-color:var(--b);color:#fff}.hb.pri:hover{background:#0036cc}
#saved{font-size:12px;color:var(--mut);white-space:nowrap;opacity:0;transition:opacity .3s}#saved.on{opacity:1}
/* layout */
main{position:absolute;top:var(--hd);left:0;right:0;bottom:0;display:flex}
#cwrap{flex:1;position:relative;overflow:hidden}
.cvs{position:absolute;inset:0;overflow:hidden;touch-action:none;background-color:var(--bg);background-image:radial-gradient(circle,#d5dae4 1px,transparent 1.2px);cursor:grab}
.cvs.panning{cursor:grabbing}
#cvM{background-color:#fbfbfd;display:none}
body.mind #cvF{display:none}body.mind #cvM{display:block}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage>svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
/* library */
#lib{width:272px;background:#fff;border-right:1px solid var(--ln);display:flex;flex-direction:column;z-index:20}
body.hideL #lib,body.mind #lib{display:none}
#tL{display:none!important}.shd .x{display:none}
#lTog{position:absolute;left:272px;top:50%;transform:translateY(-50%);z-index:30;width:18px;height:52px;border:1px solid var(--ln);border-left:0;border-radius:0 10px 10px 0;background:#fff;box-shadow:4px 4px 12px rgba(20,30,60,.08);display:grid;place-items:center;color:var(--mut);cursor:pointer;padding:0}
#lTog:hover{color:var(--ink);background:#f6f8fc}#lTog svg{width:14px;height:14px;transition:transform .2s}
body.hideL #lTog{left:0}body.hideL #lTog svg{transform:rotate(180deg)}body.mind #lTog{display:none}
@media(max-width:760px){#lTog{display:none}}
.shd{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.shd h3{font:800 15px Manrope;flex:1}
.x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--mut)}.x:hover{background:#f1f3f8}
.grab{display:none}
.ltabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 12px}
.ltabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:9px;font-size:11px;font-weight:600;color:var(--mut)}
.ltabs button svg{width:20px;height:20px}
.ltabs button.on{background:#eef3ff;color:var(--b)}
.srch{margin:10px 12px 4px;position:relative}
.srch input{width:100%;height:36px;border:1px solid var(--ln);border-radius:9px;padding:0 10px 0 32px;font:500 13px Inter;background:#f8f9fc}
.srch svg{position:absolute;left:10px;top:9px;color:var(--mut);width:17px;height:17px}
.lg{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:8px 12px 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start}
.li{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:11px;border:1px solid transparent;cursor:grab;text-align:center;font-size:11px;font-weight:600;line-height:1.2;color:#3a4256;user-select:none}
.li:hover{background:#f6f8fc;border-color:var(--ln)}
.lth{height:52px;display:grid;place-items:center}
.lth .mini{position:relative;display:grid;place-items:center;color:#fff}
.lth .mini svg{width:20px;height:20px}
.lth .pg{width:40px;height:50px;border-radius:5px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 3px 8px rgba(20,30,60,.10);overflow:hidden}
.lth .pg svg,.nd.page .sh svg.pgs{width:100%;height:100%;display:block}
.lg::-webkit-scrollbar{display:none}.lg .li{min-width:0;overflow-wrap:break-word}
.lcat{grid-column:1/-1;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:10px 2px 0}
/* panel */
#panel{width:350px;background:#fff;border-left:1px solid var(--ln);display:flex;flex-direction:column;z-index:20}
body.hideR #panel,body.mind #panel{display:none}
#pbody{flex:1;overflow:auto;padding:0 16px 30px}
.ptabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--ln)}
.ptabs button{padding:10px 10px 11px;font-size:13px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.ptabs button.on{color:var(--b);border-color:var(--b)}
.ptabs .n{background:#eef3ff;color:var(--b);border-radius:10px;padding:0 6px;font-size:11px}
.phd{display:flex;gap:12px;align-items:center;padding:4px 16px 14px}
.phd .ico{position:relative;width:42px;height:42px;display:grid;place-items:center;flex:none}
.phd h4{font:800 15px Manrope;line-height:1.25}
.phd p{font-size:12px;color:var(--mut)}
.fl{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
.in{width:100%;border:1px solid var(--ln);border-radius:9px;padding:9px 11px;font:500 13.5px Inter;color:var(--ink);background:#fff;outline:none}
.in:focus{border-color:#9db6ff;box-shadow:0 0 0 3px #e6edff}
textarea.in{min-height:82px;resize:vertical;line-height:1.45}
.row{display:flex;gap:8px}.row>*{flex:1}
.stg{display:flex;gap:6px;flex-wrap:wrap}
.stg button{padding:6px 10px;border-radius:8px;border:1px solid var(--ln);font-size:12px;font-weight:600}
.stg button.on{border-color:var(--b);background:#eef3ff;color:var(--b)}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--ln);font-size:13px;font-weight:600;background:#fff}
.btn.pri{background:var(--b);color:#fff;border-color:var(--b)}
.btn.red{color:#d62f2f}
.adc{border:1px solid var(--ln);border-radius:12px;padding:4px 12px 12px;margin-top:12px;background:#fafbfd}
.adc .ah{display:flex;align-items:center;gap:8px;margin-top:8px}
.adc .ah b{flex:1;font-size:13px}
.muted{font-size:12.5px;color:var(--mut);line-height:1.5}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kp div{background:#f6f8fc;border-radius:11px;padding:10px 12px}
.kp b{display:block;font:800 18px Manrope}.kp span{font-size:11.5px;color:var(--mut)}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mchips button{padding:6px 11px;border-radius:20px;border:1px solid var(--ln);font-size:12px;font-weight:600}
.mchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.evl{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.evl div{font-size:12.5px;padding:8px 10px;border-radius:9px;background:#f6f8fc;line-height:1.35}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12px;color:var(--mut);margin-top:6px;align-items:center}
.kbd kbd{font:600 11px Inter;background:#f1f3f8;border:1px solid var(--ln);border-bottom-width:2px;border-radius:6px;padding:2px 6px;color:var(--ink);justify-self:start}
.ver{font-size:10px;opacity:.55;margin-top:24px}
/* funnel nodes */
.nd{position:absolute;user-select:none;-webkit-user-select:none;cursor:pointer;touch-action:none}
.nd .sh{position:relative;display:grid;place-items:center;transition:box-shadow .15s}
.nd.src .sh{width:64px;height:64px;border-radius:50%;background:var(--c);color:#fff;box-shadow:0 6px 16px -4px color-mix(in srgb,var(--c) 55%,transparent)}
.nd.src .sh svg.i{width:30px;height:30px}
.nd.off .sh{width:64px;height:64px;border-radius:18px;background:#fff;border:2px solid var(--c);color:var(--c);box-shadow:0 4px 14px -6px rgba(20,30,60,.25)}
.nd.off .sh svg.i{width:28px;height:28px}
.nd.act .sh{width:64px;height:64px;border-radius:50%;background:#fff;border:2px solid var(--c);color:var(--c);box-shadow:0 3px 10px -4px rgba(20,30,60,.25)}
.nd.act .sh svg.i{width:28px;height:28px}
.nd.page .sh{width:96px;height:120px;border-radius:7px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 22px -6px rgba(20,30,60,.2);overflow:visible}
.nd.page.sm .sh{width:70px;height:88px}
.nd .lb .op{pointer-events:auto;display:inline-block;font:600 11px Inter;color:#0147FF;text-decoration:underline;text-underline-offset:2px;margin:0 0 3px;cursor:pointer}
.nd .lb .op.z{color:#9aa3b5}
.nd .lb .op:hover{color:#0036c4}
.nd.page .sh .pw{width:100%;height:100%;border-radius:7px;overflow:hidden}
.nd.sel .sh{box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--b)}
.nd .lb{position:absolute;left:50%;top:100%;transform:translateX(-50%);width:176px;text-align:center;margin-top:9px;pointer-events:none}
.lb b{display:block;font-size:12.5px;font-weight:700;line-height:1.25}
.lb .m{font-size:11.5px;color:var(--b);font-weight:800;margin-top:3px}
.lb .s{font-size:10.5px;color:var(--mut);line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700;margin-left:3px;vertical-align:1px}
.chip.g{background:#e1f7ec;color:#0c8f54}.chip.a{background:#fff1d9;color:#a96a00}.chip.r{background:#ffe4e4;color:#cf2b2b}.chip.b{background:#e6edff;color:#0137cc}
.bds{position:absolute;top:-9px;right:-12px;display:flex;gap:3px;pointer-events:none}
.bds span{background:var(--ink);color:#fff;font-size:9.5px;font-weight:700;border-radius:10px;padding:2px 6px;box-shadow:0 0 0 2px #fff}
.port{position:absolute;right:-32px;top:50%;width:24px;height:24px;margin-top:-12px;border-radius:50%;background:var(--b);color:#fff;display:none;place-items:center;cursor:crosshair;box-shadow:0 0 0 3px #fff,0 2px 6px rgba(1,71,255,.4);touch-action:none}
.port::before{content:'';position:absolute;top:-12px;bottom:-12px;left:-16px;right:-10px;border-radius:14px}
.port:hover{transform:scale(1.12)}.port{transition:transform .12s}
.nd .sh .port svg.i{width:14px;height:14px;stroke-width:3;display:block;margin:0}
.nd.ad .sh{width:52px;height:52px;border-radius:50%;background:#fff;border:2px solid var(--c);color:var(--c);box-shadow:0 4px 12px -5px rgba(20,30,60,.3)}
.nd.ad .sh svg.i{width:24px;height:24px}
.nd.ad .lb{width:150px}.nd.ad .lb b{font-size:11.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nd.ad .dt{position:absolute;right:-1px;top:-1px;width:13px;height:13px;border-radius:50%;background:#18c27a;box-shadow:0 0 0 2px #fff}
.nd.ad .dt.z{background:#c3c9d4}
.nd.ev .evc{width:200px;height:170px;background:#fff;border-radius:12px;border:1px solid var(--ln);box-shadow:0 6px 18px -10px rgba(20,30,60,.3);overflow:hidden;position:relative}
.nd.ev .evc:before{content:'';position:absolute;left:0;top:0;right:0;height:4px;background:var(--c)}
.evc .eh{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 4px;font:800 13px Manrope}
.evc .eh i{font:700 10px Inter;font-style:normal;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);border-radius:20px;padding:2px 8px}
.evc p{padding:0 12px;font-size:11.5px;font-weight:600;line-height:1.3;color:#3a4256;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.evc ul{list-style:none;padding:6px 12px 0;font-size:10.5px;color:var(--mut);line-height:1.55}
.nd.ev.sel .evc{box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--b)}
.nd.dim{opacity:.5;filter:grayscale(.85)}.nd.dim:hover{opacity:.85}
.nd:hover .port,.nd.sel .port{display:grid}
.nd.tgt .sh{box-shadow:0 0 0 3px #fff,0 0 0 5.5px #18c27a}
.nd.txt{cursor:move}
.nd.txt .tt{font:800 22px Manrope;white-space:nowrap;display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:8px}
.stc{font:700 10.5px Inter;letter-spacing:.04em;padding:4px 10px;border-radius:20px;cursor:pointer;background:#e1f7ec;color:#0c8f54}.stc.off{background:#eceef3;color:#6b7385}.stc:hover{filter:brightness(.95)}
.nd.txt small{display:block;font:500 13px Inter;color:var(--mut);padding:0 8px;white-space:nowrap}
.nd.txt.sel .tt{background:#eef3ff}
.nd.note .nt{width:200px;min-height:80px;background:#fff6c7;border-radius:4px;padding:12px;font-size:12.5px;line-height:1.45;white-space:pre-wrap;box-shadow:0 6px 18px -8px rgba(80,60,0,.35)}
.nd.note.sel .nt{box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--b)}
path.e{fill:none;stroke:#a3abbd;stroke-width:2.2}
path.e.dash{stroke-dasharray:6 6}
path.e.sel{stroke:var(--b);stroke-width:2.6}
path.e:has(+path.hit:hover){stroke:#6b7590;stroke-width:3}
path.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
path.tmp{fill:none;stroke:var(--b);stroke-width:2.4;stroke-dasharray:6 5}
.el{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid #dfe3ec;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;color:#4a5266;white-space:nowrap;box-shadow:0 1px 4px rgba(20,30,60,.08);cursor:pointer}
.wab{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px #fff;pointer-events:none}
.wab svg.i{width:12px!important;height:12px!important;stroke-width:2.2}
.mn .mi .wab{width:11px;height:11px;right:-4px;bottom:-4px;box-shadow:0 0 0 1.5px #fff}.mn .mi .wab svg.i{width:7px!important;height:7px!important}
.nd .la{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);width:176px;margin-bottom:8px;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.la span,.lbx span{font-size:10.5px;font-weight:600;color:#4a5266;background:#fff;border:1px solid #e3e7ef;border-radius:7px;padding:1px 7px;line-height:1.35;max-width:176px}
.lbx{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:5px}
#bgs{position:absolute;left:0;top:0}
#bgs .bg{position:absolute;border-radius:28px;background:color-mix(in srgb,var(--c) 5%,transparent);border:1.5px solid color-mix(in srgb,var(--c) 18%,transparent);pointer-events:none;transition:border-color .15s}
#bgs .bg.hv{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.aib{position:absolute;right:-7px;top:-7px;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#8f6bff,#0147FF 60%,#00c2ff);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(80,60,200,.35);pointer-events:none}.aib svg.i{width:12px!important;height:12px!important;stroke-width:2.2;fill:#fff}
.aib.on{pointer-events:auto;cursor:pointer;width:22px;height:22px;right:-8px;top:-8px}.aib.on:hover{transform:scale(1.12)}
.mini .aib{width:15px;height:15px;right:-5px;top:-5px}.mini .aib svg.i{width:9px!important;height:9px!important}
.mn .mi .aib{width:11px;height:11px;right:-4px;top:-4px;box-shadow:0 0 0 1.5px #fff}.mn .mi .aib svg.i{width:7px!important;height:7px!important}
.nd.ai .sh{width:64px;height:64px;border-radius:18px;background:#fff;border:2px solid var(--c);color:var(--c);box-shadow:0 4px 14px -6px rgba(20,30,60,.25),0 0 0 4px color-mix(in srgb,#8f6bff 14%,transparent)}
.nd.ai .sh svg.i{width:28px;height:28px}
.nd.aitgt .sh{outline:3px dashed #8f6bff;outline-offset:6px}.lgh.in{opacity:.45}
.lgh{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%);display:grid;place-items:center;border:2px dashed #94a3b8;border-radius:14px;background:rgba(100,116,139,.14);opacity:.8;overflow:hidden}.lgh>*{width:100%;height:100%;filter:grayscale(1);opacity:.55}.lgh b{display:grid;place-items:center;font:800 13px Manrope;color:#475569}.lgh.no{opacity:.35}body.ldr,body.ldr *{cursor:grabbing!important}
#bgs .bge{background:none;border:0;padding:0;box-shadow:none;transform:none;position:absolute;pointer-events:auto;--w:max(12px,calc(9px*var(--k,1)));z-index:1}
#bgs .bge.ql,#bgs .bge.qr{top:var(--w);bottom:var(--w);width:var(--w);cursor:ew-resize}#bgs .bge.ql{left:calc(var(--w)/-2)}#bgs .bge.qr{right:calc(var(--w)/-2)}
#bgs .bge.qt,#bgs .bge.qb{left:var(--w);right:var(--w);height:var(--w);cursor:ns-resize}#bgs .bge.qt{top:calc(var(--w)/-2)}#bgs .bge.qb{bottom:calc(var(--w)/-2)}
#bgs .bge.qtl,#bgs .bge.qtr,#bgs .bge.qbl,#bgs .bge.qbr{width:calc(var(--w)*1.6);height:calc(var(--w)*1.6)}#bgs .bge.qtl{left:calc(var(--w)/-2);top:calc(var(--w)/-2);cursor:nwse-resize}#bgs .bge.qbr{right:calc(var(--w)/-2);bottom:calc(var(--w)/-2);cursor:nwse-resize}#bgs .bge.qtr{right:calc(var(--w)/-2);top:calc(var(--w)/-2);cursor:nesw-resize}#bgs .bge.qbl{left:calc(var(--w)/-2);bottom:calc(var(--w)/-2);cursor:nesw-resize}
#bgs .bg:has(.bge:hover){border-color:color-mix(in srgb,var(--c) 55%,transparent);border-width:2px}
#bgs .bgt{position:absolute;pointer-events:auto;cursor:move;--m:max(14px,calc(10px*var(--k,1)));margin:calc(-1*var(--m));padding:var(--m);border-radius:16px;transition:background .15s}

 V.world=(cx,cy)=>{const v=st(),r=cv.getBoundingClientRect();return {x:(cx-r.left-v.x)/v.s,y:(cy-r.top-v.y)/v.s}};
 V.center=()=>{const r=cv.getBoundingClientRect();return V.world(r.left+r.width/2,r.top+r.height/2)};
 V.fitBox=(b,max=1.1)=>{const r=cv.getBoundingClientRect();if(!r.width)return;const pad=isMob()?24:70;const s=Math.min(max,(r.width-pad*2)/Math.max(1,b.w),(r.height-pad*2)/Math.max(1,b.h));const v=st();const mn=isMob()?(opt.mobMin||.5):.12;v.s=Math.max(mn,s);v.x=(r.width-b.w*v.s)/2-b.x*v.s;v.y=(r.height-b.h*v.s)/2-b.y*v.s;if(s<mn&&opt.mobLeft)v.x=pad-b.x*v.s;if(s<mn&&opt.mobFocus){const f=opt.mobFocus();v.x=r.width/2-f.x*v.s;v.y=r.height/2-f.y*v.s}V.apply();save()};

const ROBN=`Boa Gabriel, a estrutura está bem encaminhada, o próximo passo é transformar o mapa em um plano de implementação, detalhando os ativos e as regras de cada etapa:
• Oferta e qualificação: definir público, promessa, entrega e critérios para encaminhar ao comercial.
Eu organizaria isso em um checklist por funil, primeiro fecharia Webinar, depois template e Diag360.
O mapa do fluxo mostra o caminho, para ficar 100% implementável, cada etapa precisa ter o que será entregue, a peça pronta e a regra de funcionamento.
Após isso entendo que já podemos planejar e discutir sobre a estratégia, e estando tudo certo, pode ir para as próximas etapas
• Copy e criativos: produzir anúncios, roteiros, argumentos, provas, objeções e CTAs de cada funil.
• Páginas: finalizar copy e layout das LPs, formulários, páginas de obrigado, agendamento e vendas, mantendo a mesma promessa do anúncio.
• Grupos de WhatsApp: definir entrada, descrição, mensagem fixada, boas-vindas, calendário de conteúdo, aquecimento, lembretes e pós-live.
• Sequências: escrever mensagens e e-mails de entrega, nutrição, convite, recuperação e acompanhamento, com prazo e condição de parada.
• Webinar e comercial: fechar roteiro da aula, apresentação da oferta, scripts de SDR/closer e caminhos para quem não assistiu, não agendou ou não comprou.
• Operação: conectar CRM, agenda, checkout e automações, definir responsáveis e testar a jornada completa.`;

 if(a==='on'){const k=MP().nodes[mSel].bk;setOn(k,FUNB(k).on===false)}
 if(a==='open'){const n=nById(mSel);S.mode='funnel';S.board=n.f;save();applyMode();fSelect({t:'n',id:n.id});fit()}});
function mSnapSet(id,k,v){const m=MP(),o=m.nodes[id];if(!o)return;snap();
 if(k==='cl')S.mfold[id]=v;
 if(k==='c'){if(o.bk){const b=FUNB(o.bk);b.col=v;const t=nById(o.bk+'_title');if(t)t.col=v;boards()}else if(isReal(id))nById(id).col=v}
 save();mRender()}
function newNodeIn(f,from){const P=from&&nById(from);const kids=P?S.edges.filter(e=>e.a===P.id).length:0;
 let x,y;if(P){const sz=szOf(P);x=P.x+sz.w/2+230-23;y=P.y+sz.h/2-23+kids*130}else{const ns=S.nodes.filter(n=>n.f===f&&n.kind!=='ev');x=110;y=ns.length?Math.max(...ns.map(n=>n.y))+200:200}
 const n={...blank(),id:'n'+uid(),f,kind:'act',ic:'chat',col:'#0147FF',nm:'',st:'b',x:Math.round(x),y:Math.round(y)};S.nodes.push(n);if(P)S.edges.push({id:uid(),a:P.id,b:n.id,l:'',st:'',dash:0});return n.id}
function mAdd(id,child){
 if(editing)commitEdit();const m=MP();let n=m.nodes[id];if(!n)return;if(!child&&!n.p)child=true;
 const pid=child?id:n.p,p=m.nodes[pid];if(!p||p.grp)return;snap();S.mfold[pid]=false;let nid;
 if(pid==='R'){const k='b'+uid(),col=MC[S.boards.length%MC.length];S.boards.push({k,nm:'',col,on:true});const ys=S.nodes.map(z=>z.y);S.nodes.push({id:k+'_title',f:k,kind:'txt',ic:'',col,nm:'',s:'',x:30,y:(ys.length?Math.max(...ys):0)+300});nid='B:'+k;boards()}
 else nid=newNodeIn(p.bk||mBoard(pid),p.bk?null:pid);
 save();mSel=nid;mRender();startEdit(nid,'',true);
}
function rmNode(id){S.nodes=S.nodes.filter(n=>n.id!==id);S.edges=S.edges.filter(e=>e.a!==id&&e.b!==id)}
function rmBoard(k){S.boards=S.boards.filter(b=>b.k!==k);S.nodes.filter(n=>n.f===k).forEach(n=>rmNode(n.id));if(S.board===k)S.board='all';boards()}
function mDel(id){const m=MP(),n=m.nodes[id];if(!n||!n.p||n.grp)return;
 if(n.bk){if(!confirm(`Apagar o funil "${n.t}" inteiro? (Ctrl+Z desfaz)`))return;snap();rmBoard(n.bk)}else if(isReal(id)){snap();rmNode(id)}else return;
 const p=m.nodes[n.p],i=p.ch.indexOf(id);mSel=p.ch[i+1]||p.ch[i-1]||p.id;save();mRender()}
function startEdit(id,initial,isNew){
 if(editing)commitEdit();const o=MP().nodes[id];if(!o||!(o.bk||isReal(id)))return;const el=$(`#mns .mn[data-id="${id}"]`);if(!el)return;mSel=id;mSelect(id);
 const tx=el.querySelector('.tx');editing={id,old:o.t,isNew};el.classList.add('edit');tx.contentEditable='true';if(initial!==undefined)tx.textContent=initial;tx.focus();
 const rg=document.createRange();rg.selectNodeContents(tx);if(initial!==undefined)rg.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(rg);
 tx.oninput=()=>{posMTB()};tx.onblur=()=>{if(editing&&editing.id===id)commitEdit()};
}
function commitEdit(cancel){
 if(!editing)return;const {id,old,isNew}=editing;editing=null;const o=MP().nodes[id];const el=$(`#mns .mn[data-id="${id}"] .tx`);
 if(!o)return;let t=cancel?old:(el?el.innerText.replace(/\n+$/,'').trim():o.t);
 if(!t){if(isNew){if(o.bk)rmBoard(o.bk);else rmNode(id);mSel=o.p;save();mRender();return}t=old||'Sem título'}
 if(t!==old&&!isNew)snap();
 if(o.bk){FUNB(o.bk).nm=t;const tt=nById(o.bk+'_title');if(tt)tt.nm=t;boards()}else{const n=nById(id);if(n)n.nm=t}
 save();mRender();
}
/* ponteiro no mapa: seleção, arrastar pra reorganizar, toque duplo edita */
let mDrag=null,lastTap={id:null,t:0};
cvM.addEventListener('pointerdown',e=>{const f=e.target.closest('.cc[data-f]');if(!f)return;e.stopPropagation();e.preventDefault();mSnapSet(f.dataset.f,'cl',!MP().nodes[f.dataset.f].cl)},true);
cvM.addEventListener('pointerdown',e=>{
 const nd=e.target.closest('.mn');if(!nd||nd.classList.contains('edit'))return;
 const id=nd.dataset.id;const now=Date.now();
 if(lastTap.id===id&&now-lastTap.t<350){lastTap={id:null,t:0};e.preventDefault();startEdit(id);return}
 lastTap={id,t:now};
 if(editing)commitEdit();mSelect(id);
 mDrag={id,el:nd,sx:e.clientX,sy:e.clientY,m:false,ox:parseFloat(nd.style.left),oy:parseFloat(nd.style.top)};nd.setPointerCapture(e.pointerId);
});
cvM.addEventListener('pointermove',e=>{
 if(!mDrag)return;const s=S.vM.s;const dx=(e.clientX-mDrag.sx)/s,dy=(e.clientY-mDrag.sy)/s;
 if(!mDrag.m&&Math.abs(dx)+Math.abs(dy)<6/s)return;
 if(!MP().nodes[mDrag.id].p)return;
 if(!mDrag.m){mDrag.m=true;mDrag.el.classList.add('drag');$('#mtb').classList.remove('on')}
 mDrag.el.style.left=(mDrag.ox+dx)+'px';mDrag.el.style.top=(mDrag.oy+dy)+'px';
 document.querySelectorAll('.mn.drop').forEach(x=>x.classList.remove('drop'));
 const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.mn');if(t&&t.dataset.id!==mDrag.id&&!isDesc(mDrag.id,t.dataset.id))t.classList.add('drop');
});
const mUp=e=>{
 if(!mDrag)return;const d=mDrag;mDrag=null;if(!d.m)return;
 const t=document.querySelector('.mn.drop');const m=MP(),n=m.nodes[d.id];
 if(t&&isReal(d.id)){const pid=t.dataset.id,tp=m.nodes[pid];const f=tp.bk||(isReal(pid)?nById(pid).f:null);
  if(f&&!tp.grp){snap();if(isReal(n.p))S.edges=S.edges.filter(e=>!(e.a===n.p&&e.b===d.id));
   const sub=[];(function w(x){if(isReal(x))sub.push(x);m.nodes[x].ch.forEach(w)})(d.id);sub.forEach(x=>{const z=nById(x);if(z.f!==f)z.f=f});
   if(isReal(pid)&&!S.edges.some(e=>e.a===pid&&e.b===d.id))S.edges.push({id:uid(),a:pid,b:d.id,l:'',st:'',dash:0});
   S.mfold[pid]=false;save()}}
 mRender();
};
cvM.addEventListener('pointerup',mUp);cvM.addEventListener('pointercancel',mUp);
cvM.addEventListener('dblclick',e=>{const nd=e.target.closest('.mn');if(nd&&!nd.classList.contains('edit'))startEdit(nd.dataset.id);else if(!nd){const w=VM.world(e.clientX,e.clientY);mSel=MP().root;mAdd(MP().root,true)}});
function isDesc(a,b){const m=MP();let n=m.nodes[b];while(n){if(n.id===a)return true;n=m.nodes[n.p]}return false}
function mNav(k){
 const m=MP(),n=m.nodes[mSel];if(!n)return mSelect(m.root);const side=sideOf(mSel);
 const toChild=()=>{if(n.cl&&n.ch.length){S.mfold[mSel]=false;save();mRender();}const c=n.p?n.ch:n.ch.filter(c=>(m.nodes[c].side||'R')===(k==='ArrowRight'?'R':'L'));if(c.length)mSelect(c[Math.floor((c.length-1)/2)])};
 if(k==='ArrowRight'){if(!n.p||side==='R')toChild();else mSelect(n.p)}
 if(k==='ArrowLeft'){if(!n.p||side==='L')toChild();else mSelect(n.p)}
 if(k==='ArrowUp'||k==='ArrowDown'){if(!n.p)return;const vis=[...document.querySelectorAll('#mns .mn')].map(e=>m.nodes[e.dataset.id]).filter(o=>o&&o.p&&depth(o.id)===depth(mSel)&&sideOf(o.id)===side);
  vis.sort((a,b)=>a._y-b._y);const i=vis.indexOf(n);const t=vis[i+(k==='ArrowUp'?-1:1)];if(t)mSelect(t.id)}
}
function mMove(dir){return;const m=MP(),n=m.nodes[mSel];if(!n||!n.p)return;const p=m.nodes[n.p],i=p.ch.indexOf(mSel),j=i+dir;if(j<0||j>=p.ch.length)return;snap();[p.ch[i],p.ch[j]]=[p.ch[j],p.ch[i]];save();mRender()}

/* ---------- teclado ---------- */
document.addEventListener('keydown',e=>{
 const tag=(document.activeElement||{}).tagName;const typing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||!!(document.activeElement&&document.activeElement.isContentEditable);
 const mod=e.ctrlKey||e.metaKey;
 if(S.mode==='mind'&&editing){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const id=editing.id;commitEdit();if(MP().nodes[id])mSelect(id);return}
  if(e.key==='Tab'){e.preventDefault();const id=editing.id;commitEdit();if(MP().nodes[id])mAdd(id,true);return}
  if(e.key==='Escape'){e.preventDefault();const id=editing.id;commitEdit(true);if(MP().nodes[id])mSelect(id);return}
  return;
 }
 if(typing)return;
 if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
 if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
 if(e.key==='0'&&mod){e.preventDefault();fit();return}
 if(S.mode==='funnel'){
  if((e.key==='Delete'||e.key==='Backspace')&&fSel){e.preventDefault();delSel()}
  if(mod&&e.key.toLowerCase()==='d'&&fSel&&fSel.t==='n'){e.preventDefault();dupNode()}
  if(e.key==='Escape'){fSelect(null);$('#qm').classList.remove('on')}
  return;
 }
 if(!mSel){if(e.key==='Tab'||e.key==='Enter'||e.key.startsWith('Arrow')){e.preventDefault();mSelect(MP().root)}return}
 if(e.key==='Tab'){e.preventDefault();mAdd(mSel,true);return}
 if(e.key==='Enter'){e.preventDefault();mAdd(mSel,false);return}
 if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();mDel(mSel);return}
 if(e.key==='Escape'){mSelect(null);return}
 if(e.key==='F2'||e.key===' '){e.preventDefault();startEdit(mSel);return}
 if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();mMove(e.key==='ArrowUp'?-1:1);return}
 if(e.key.startsWith('Arrow')){e.preventDefault();mNav(e.key);return}
 if(e.key==='.'&&mod){e.preventDefault();const n=MP().nodes[mSel];if(n.ch.length)mSnapSet(mSel,'cl',!n.cl);return}
 if(e.key.length===1&&!mod&&!e.altKey){e.preventDefault();startEdit(mSel,e.key)}
});

/* ---------- topo, modos, quadros ---------- */
function boards(){
 const sel=$('#board');
 if(S.mode==='funnel'){sel.innerHTML=`<option value="all">Todos os funis</option>`+S.boards.map(b=>`<option value="${b.k}">${esc(b.nm)}</option>`).join('')+`<option value="__new">+ Novo funil</option>`;sel.value=S.board;const b=FUNB(S.board);$('#bdot').style.background=b?b.col:'#161b2e'}
 else{sel.innerHTML=`<option value="all">Todos os funis</option>`+S.boards.map(b=>`<option value="${b.k}">${esc(b.nm)}${b.on===false?' (inativo)':''}</option>`).join('');sel.value=FUNB(S.board)?S.board:'all';const b=FUNB(S.board);$('#bdot').style.background=b?b.col:'#0147FF'}
}
$('#board').onchange=e=>{const v=e.target.value;
 if(S.mode==='funnel'){if(v==='__new'){const nm=prompt('Nome do novo funil');if(nm){snap();const k='b'+uid();S.boards.push({k,nm,col:MC[S.boards.length%MC.length]});S.boards[S.boards.length-1].on=true;S.nodes.push({id:k+'_title',f:k,kind:'txt',col:MC[(S.boards.length-1)%MC.length],nm,s:'',x:30,y:40});S.board=k;save()}boards();fSel=null;fRender();panel();setTimeout(fit,30);return}
  S.board=v;fSel=null;save();boards();fRender();panel();fit()}
 else{S.board=v;mSel=null;save();boards();mRender();fit()}
};
function applyMode(){
 document.body.classList.toggle('mind',S.mode==='mind');
 document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
 $('#tL').style.display=$('#tR').style.display=S.mode==='mind'?'none':'';
 closeSheets();boards();
 if(S.mode==='funnel'){$('#mtb').classList.remove('on');fRender();VF.apply();panel()}else{$('#ftb').classList.remove('on');mRender();VM.apply()}
 help();
}
$('#mode').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.m===S.mode)return;S.mode=b.dataset.m;save();applyMode();const v=S.mode==='mind'?S.vM:S.vF;if(v.x===0&&v.y===0)setTimeout(fit,30)};
function fit(){
 if(S.mode==='funnel'){const ns=visN();if(!ns.length)return;let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;ns.forEach(n=>{const b=bOf(n),ext=n.kind==='txt'||n.kind==='note'?0:60,lw=n.kind==='txt'||n.kind==='note'?0:Math.max(0,(176-b.w)/2);x1=Math.min(x1,b.x-lw);y1=Math.min(y1,b.y);x2=Math.max(x2,b.x+b.w+lw);y2=Math.max(y2,b.y+b.h+ext)});VF.fitBox({x:x1,y:y1,w:x2-x1,h:y2-y1})}
 else{const m=MP();let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;document.querySelectorAll('#mns .mn').forEach(e=>{const n=m.nodes[e.dataset.id];x1=Math.min(x1,n._x);y1=Math.min(y1,n._y);x2=Math.max(x2,n._x+n._w);y2=Math.max(y2,n._y+n._h)});VM.fitBox({x:x1-30,y:y1,w:x2-x1+60,h:y2-y1},1.15)}
}
const CV=()=>S.mode==='funnel'?VF:VM;
$('#zIn').onclick=()=>CV().zoomBy(1.2);$('#zOut').onclick=()=>CV().zoomBy(1/1.2);$('#zFit').onclick=fit;$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
$('#zHelp').onclick=()=>$('#help').classList.toggle('on');
function help(){$('#help').innerHTML=S.mode==='mind'?`<h5>Atalhos do mapa</h5><div class="kbd"><kbd>Tab</kbd><span>novo filho</span><kbd>Enter</kbd><span>novo irmão</span><kbd>Digitar</kbd><span>edita o selecionado</span><kbd>2 cliques</kbd><span>edita</span><kbd>Del</kbd><span>apaga</span><kbd>Setas</kbd><span>navega</span><kbd>Alt ↑↓</kbd><span>reordena</span><kbd>Ctrl .</kbd><span>recolhe / expande</span><kbd>Arrastar</kbd><span>solta em outra etapa pra religar no funil</span><kbd>Scroll</kbd><span>zoom</span><kbd>Ctrl Z</kbd><span>desfaz</span></div>`:`<h5>Atalhos do funil</h5><div class="kbd"><kbd>Arrastar</kbd><span>elemento da biblioteca pro quadro</span><kbd>●+</kbd><span>puxa conexão; soltar no vazio cria a próxima etapa</span><kbd>2 cliques</kbd><span>abre a configuração</span><kbd>Del</kbd><span>apaga</span><kbd>Ctrl D</kbd><span>duplica</span><kbd>Ctrl Z</kbd><span>desfaz</span><kbd>Scroll</kbd><span>zoom · Shift+scroll move</span><kbd>Ctrl 0</kbd><span>enquadra</span></div>`}
function closeSheets(){document.body.classList.remove('openL','openR')}
function closeLib(){if(isMob())closeSheets();else{document.body.classList.add('hideL');$('#tL').classList.remove('on')}}
$('#lTog').onclick=()=>$('#tL').click();
$('#tL').onclick=()=>{if(isMob()){document.body.classList.toggle('openL');document.body.classList.remove('openR');return}document.body.classList.toggle('hideL');$('#tL').classList.toggle('on')};
$('#tR').onclick=()=>{if(isMob()){document.body.classList.toggle('openR');document.body.classList.remove('openL');panel();return}document.body.classList.toggle('hideR');$('#tR').classList.toggle('on');panel()};
$('#fab').onclick=()=>{if(S.mode==='mind'){mAdd(mSel||MP().root,true)}else{document.body.classList.toggle('openL');document.body.classList.remove('openR')}};
/* arquivo */
$('#bMore').onclick=e=>{
 const qm=$('#qm'),r=$('#cwrap').getBoundingClientRect(),b=e.currentTarget.getBoundingClientRect();
 qm.innerHTML=`<h5>Arquivo</h5><button data-a="exp"><span class="q" style="background:#0147FF">${ic('copy')}</span>Exportar backup (.json)</button><button data-a="imp"><span class="q" style="background:#18c27a">${ic('plus')}</span>Importar backup</button><button data-a="fit"><span class="q" style="background:#475569">${ic('grid')}</span>Enquadrar tudo</button><button data-a="rst"><span class="q" style="background:#ff5a5a">${ic('rotate')}</span>Voltar ao original</button>`;
 qm.style.left=Math.max(8,Math.min(b.right-r.left-236,r.width-246))+'px';qm.style.top='8px';qm.classList.add('on');
 qm.onclick=ev=>{const x=ev.target.closest('button');if(!x)return;qm.classList.remove('on');const a=x.dataset.a;
  if(a==='exp'){const bl=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download='funis-invt-'+new Date().toISOString().slice(0,10)+'.json';l.click()}
  if(a==='imp')$('#imp').click();if(a==='fit')fit();
  if(a==='rst'&&confirm('Voltar os funis ao original? Anúncios importados ficam. (Ctrl+Z desfaz)')){snap();const f=buildFunnel();Object.assign(S,{boards:f.boards,nodes:f.nodes,edges:f.edges,board:'all',mfold:{}});fSel=null;mSel=null;save();applyMode();setTimeout(fit,30)}};
};
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);snap();
 if(o.v===6){S=o;MCACHE=null;save();applyMode();setTimeout(fit,30);alert('Backup importado.')}
 else if(o.nodes){const n=mergeOld(o);save();applyMode();alert(n?`Copy e anúncios da versão antiga trazidos (${n}).`:'Arquivo antigo sem copy ou anúncios pra trazer.')}
 else alert('Arquivo não reconhecido.')}catch(err){alert('Não consegui ler esse arquivo.')}};rd.readAsText(f);e.target.value=''};
window.addEventListener('resize',()=>{posFTB();posMTB()});

/* início */
if(location.hash==='#mapa')S.mode='mind';else if(location.hash==='#funil')S.mode='funnel';
if(isMob()){document.body.classList.remove('hideL','hideR')}else{document.body.classList.add('hideR');$('#tR').classList.remove('on')}
lib();dbar();applyMode();Promise.all([spLoad(),lvLoad()]).then(()=>{if(S.mode==='funnel')fRender();if(!fSel)panel()});
if(!localStorage.getItem(KEY+'-fit')){localStorage.setItem(KEY+'-fit','1');setTimeout(fit,60)}else{setTimeout(()=>{CV().apply()},0)}
</script>
